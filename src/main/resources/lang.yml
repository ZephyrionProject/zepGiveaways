messages:
  no-permission: "<white>ʙᴜ ᴋᴏᴍᴜᴛᴜ ᴋᴜʟʟᴀɴᴍᴀᴋ ɪᴄɪɴ ʏᴇᴛᴋɪɴɪᴢ ʙᴜʟᴜɴᴍᴀᴍᴀᴋᴛᴀᴅɪʀ."
  usage-start: "<white>ʜᴀᴛᴀʟɪ ᴋᴜʟʟᴀɴɪᴍ. ʟᴜᴛғᴇɴ /cekilis başlat <kelime> <süre> sᴇᴋʟɪɴᴅᴇ ᴋᴜʟʟᴀɴɪɴ. (Örn: /cekilis baslat deneme 1m)"
  usage-finish: "<white>ʜᴀᴛᴀʟɪ ᴋᴜʟʟᴀɴɪᴍ. ʟᴜᴛғᴇɴ sᴀᴅᴇᴄᴇ /cekilis bitir ʏᴀᴢɪɴ."
  no-item-in-hand: "<white>ᴄᴇᴋɪʟɪs ʙᴀsʟᴀᴛᴍᴀᴋ ɪᴄɪɴ ᴇʟɪɴɪᴢᴅᴇ ʙɪʀ ᴇsʏᴀ ᴛᴜᴛᴍᴀʟɪsɪɴɪᴢ!"
  no-active-giveaway: "<white>sᴜ ᴀɴᴅᴀ ᴅᴇᴠᴀᴍ ᴇᴅᴇɴ ʙɪʀ ᴄᴇᴋɪʟɪs ʙᴜʟᴜɴᴍᴜʏᴏʀ."
  already-active: "<white>ʜᴀʟɪʜᴀᴢɪʀᴅᴀ ᴅᴇᴠᴀᴍ ᴇᴅᴇɴ ʙɪʀ ᴄᴇᴋɪʟɪs ᴠᴀʀ! ᴏɴᴄᴇ ᴏɴᴜ ʙɪᴛɪʀᴍᴇʟɪsɪɴɪᴢ."
  started-successfully: "<white>ᴄᴇᴋɪʟɪs ʙᴀsᴀʀɪʏʟᴀ ʙᴀsʟᴀᴛɪʟᴅɪ! ᴋᴇʟɪᴍᴇ: <yellow>%keyword%</yellow> | sᴜʀᴇ: <yellow>%time%</yellow>"
  finished-manually: "<white>ᴄᴇᴋɪʟɪs ʏᴏɴᴇᴛɪᴄɪ ᴛᴀʀᴀғɪɴᴅᴀɴ ᴍᴀɴᴜᴇʟ ᴏʟᴀʀᴀᴋ sᴏɴʟᴀɴᴅɪʀɪʟɪʏᴏʀ..."
  not-enough-players: "<white>ʏᴇᴛᴇʀʟɪ ᴋᴀᴛɪʟɪᴍᴄɪ sᴀɢʟᴀɴᴀᴍᴀᴅɪɢɪ ɪᴄɪɴ ᴄᴇᴋɪʟɪs sᴏɴᴜᴄʟᴀɴᴅɪʀɪʟᴀᴍᴀᴅɪ."

